<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>French Rap Vault - Lecteur Intégré</title>
  <style>
    :root {
      --bg-color: #0d0f12;
      --card-bg: #161b22;
      --accent: #1db954;
      --accent-hover: #1ed760;
      --text: #f0f6fc;
      --text-dim: #8b949e;
      --border: #30363d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    header {
      background-color: #06080a;
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    nav {
      display: flex;
      gap: 1.5rem;
    }

    nav button {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s;
    }

    nav button.active, nav button:hover {
      color: var(--text);
      border-bottom: 2px solid var(--accent);
    }

    .search-box input {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      width: 250px;
      outline: none;
    }

    main {
      flex: 1;
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .section-title {
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      font-weight: 700;
      border-left: 4px solid var(--accent);
      padding-left: 0.75rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--accent);
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .card-content {
      padding: 1rem;
    }

    .card-title {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .card-subtitle {
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-top: 0.2rem;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.88);
      z-index: 200;
      overflow-y: auto;
      padding: 2rem;
    }

    .modal-content {
      background: var(--card-bg);
      max-width: 900px;
      margin: 2rem auto;
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 2rem;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      font-size: 2rem;
      color: var(--text-dim);
      cursor: pointer;
    }

    .artist-header {
      display: flex;
      gap: 2rem;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .artist-header img {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent);
    }

    .track-list {
      list-style: none;
      background: #0d0f12;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border);
      margin-top: 1rem;
      max-height: 400px;
      overflow-y: auto;
    }

    .track-item {
      padding: 0.8rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .track-item:hover {
      background: #161b22;
    }

    .play-btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-weight: 700;
      cursor: pointer;
    }

    .play-btn:hover {
      background: var(--accent-hover);
    }

    /* BARRE DE LECTURE PERMANENTE */
    .player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 85px;
      background: #06080a;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0.5rem 2rem;
      z-index: 300;
    }

    .progress-container {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      cursor: pointer;
      margin-bottom: 0.5rem;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.1s linear;
    }

    .player-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .now-playing {
      display: flex;
      align-items: center;
      gap: 1rem;
      width: 30%;
    }

    .now-playing-title {
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .embed-frame {
      display: none;
    }

    .hidden { display: none; }
  </style>
</head>
<body>

  <header>
    <div class="logo">RapFR DB</div>
    <nav>
      <button id="nav-home" class="active" onclick="switchTab('home')">Accueil</button>
      <button id="nav-artists" onclick="switchTab('artists')">Artistes</button>
    </nav>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Rechercher..." oninput="handleSearch()">
    </div>
  </header>

  <main>
    <section id="sec-home">
      <h2 class="section-title">Récemment consultés</h2>
      <div class="grid" id="recentGrid"></div>
    </section>

    <section id="sec-artists" class="hidden">
      <h2 class="section-title">Artistes Français</h2>
      <div class="grid" id="artistGrid"></div>
    </section>
  </main>

  <!-- Modal Artiste -->
  <div id="artistModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Player Fixe en Bas avec Barre Verte -->
  <div class="player-bar">
    <div class="progress-container" onclick="seek(event)">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="player-controls">
      <div class="now-playing">
        <div class="now-playing-title" id="nowPlayingText">Aucun morceau en cours</div>
      </div>
      <div id="playerFrameContainer"></div>
    </div>
  </div>

  <script>
    // Chargement des données transmises
    const rawData = [
      {
        "id": 1,
        "name": "Lagui",
        "handle": "@Laguitreize",
        "avatar": "https://yt3.googleusercontent.com/n4_J9HkwLGdi1-wi5KcX6veaaQf5ZRzDLNP0CiGatLM8eXzHueN41a0nsS5mYi6FtKK9PqBRIw=s0",
        "tracks": [
          {"title": "Lagui - OLIVIA VALERE (Clip Officiel)", "youtube_id": "MuVh4zR-5DM"},
          {"title": "Lagui - Capo (Visualizer)", "youtube_id": "Ygh-IfaQ-0g"},
          {"title": "Lagui - Mandat de dépôt (Feat. Jul)", "youtube_id": "uJSp9cwPrq0"},
          {"title": "Lagui - Grosse salope (Visualizer)", "youtube_id": "oV0CIENnt0k"},
          {"title": "Lagui - La Donneuse (Feat. Gazo)", "youtube_id": "hUDrfrO7eaI"},
          {"title": "Lagui - Bob Marley (Feat. Kaaris)", "youtube_id": "xFjQZF7q_O8"}
        ]
      },
      {
        "id": 2,
        "name": "JUL",
        "handle": "@DORETDEPLATINE",
        "avatar": "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400",
        "tracks": []
      },
      {
        "id": 3,
        "name": "Werenoi",
        "handle": "@werenoi93",
        "avatar": "https://yt3.googleusercontent.com/s_5PfxJQU8Xvzedu_NlV-lBnpasJ0vl9BOXKH9G3EtMspPRQg5YMWz_rJIW5d9aVPBYQk3OTKQ=s0",
        "tracks": [
          {"title": "Werenoi Ft. GIMS - Piano", "youtube_id": "ShR_fQrqsdA"},
          {"title": "Werenoi Ft. Damso, Ninho - Triple V", "youtube_id": "hTgk2Rs99b0"},
          {"title": "Werenoi (ft. PLK) - En pétard", "youtube_id": "cI4JTADjQZ4"},
          {"title": "Werenoi (ft. Gazo) - La famine", "youtube_id": "X59gzMNuOqQ"},
          {"title": "Werenoi (ft. SDM) - Dans un verre", "youtube_id": "FjR2kJTbslQ"}
        ]
      },
      {
        "id": 4,
        "name": "Maes",
        "handle": "@Maesofficiel",
        "avatar": "https://yt3.googleusercontent.com/3kGYRhyoa_2Glq46ztlqROi2G9fIBqQkMWo89PEWZj469Eqfz8CVVcCb-kyxIIfLWEV_GYE-8h0=s0",
        "tracks": [
          {"title": "Maes - RIVOLI", "youtube_id": "bFEM0DDsLWk"},
          {"title": "Maes - SANS BOUSSOLE", "youtube_id": "qePsbLYnDyg"},
          {"title": "Maes - SURVIE ft Ninho", "youtube_id": "radUTeFRNb8"},
          {"title": "Maes - 4MOTION ft. PLK", "youtube_id": "q2gs0HSdRxY"},
          {"title": "Maes - Dybala ft. Jul", "youtube_id": "VOxtCodiqPU"}
        ]
      },
      {
        "id": 5,
        "name": "Ninho",
        "handle": "@NinhoOfficiel",
        "avatar": "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400",
        "tracks": []
      },
      {
        "id": 6,
        "name": "SDM",
        "handle": "@SDMofficiel",
        "avatar": "https://yt3.googleusercontent.com/HPXJxcfCQfui4DCxZrBi64AnDPL5ryZQbbXCyjrCRyp1h9RfV7qrSAsk3tzDI6juOunAq2Lw=s0",
        "tracks": [
          {"title": "karma feat kizz bouba official", "youtube_id": "nzUvFI5nk4I"},
          {"title": "LIM PAPA LAISSE MOI", "youtube_id": "T2Q2xg2bNWg"}
        ]
      },
      {
        "id": 7,
        "name": "Gazo",
        "handle": "@GazoOfficiel",
        "avatar": "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400",
        "tracks": []
      },
      {
        "id": 8,
        "name": "Tiakola",
        "handle": "@TiakolaOfficiel",
        "avatar": "https://yt3.googleusercontent.com/jAW34xcjZoWo2bnEJoz3QZLEJob_Ee15VqJ_VKYG6EOybfmq3qhKBbELbDnl2nRsFIDM15oaWAc=s0",
        "tracks": [
          {"title": "Tiakola - Offbeat Melo", "youtube_id": "XMBDdTHTIEo"},
          {"title": "Tiakola, Genezio - MBIFE", "youtube_id": "_j7rXacobJM"},
          {"title": "TIAKOLA X GAZO - NOTRE DAME", "youtube_id": "5admyVZkhwI"}
        ]
      }
    ];

    let recentHistory = JSON.parse(localStorage.getItem('recent_artists')) || [1, 3, 4, 8];
    let progressInterval = null;

    function renderArtists(artists, containerId) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";
      artists.forEach(artist => {
        const avatarUrl = artist.avatar || 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400';
        const card = document.createElement("div");
        card.className = "card";
        card.onclick = () => openArtistModal(artist);
        card.innerHTML = `
          <img src="${avatarUrl}" alt="${artist.name}" onerror="this.src='https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400'">
          <div class="card-content">
            <div class="card-title">${artist.name}</div>
            <div class="card-subtitle">${artist.tracks.length} morceau(x)</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderRecent() {
      const recentArtists = rawData.filter(a => recentHistory.includes(a.id));
      renderArtists(recentArtists, "recentGrid");
    }

    function switchTab(tab) {
      document.getElementById("sec-home").classList.add("hidden");
      document.getElementById("sec-artists").classList.add("hidden");
      document.getElementById("nav-home").classList.remove("active");
      document.getElementById("nav-artists").classList.remove("active");

      if(tab === 'home') {
        document.getElementById("sec-home").classList.remove("hidden");
        document.getElementById("nav-home").classList.add("active");
        renderRecent();
      } else {
        document.getElementById("sec-artists").classList.remove("hidden");
        document.getElementById("nav-artists").classList.add("active");
        renderArtists(rawData, "artistGrid");
      }
    }

    function playTrack(title, youtubeId) {
      document.getElementById("nowPlayingText").innerText = title;
      const container = document.getElementById("playerFrameContainer");
      
      // Intégration du lecteur YouTube direct
      container.innerHTML = `
        <iframe width="200" height="60" src="https://www.youtube-nocookie.com/embed/${youtubeId}?autoplay=1" 
                allow="autoplay; encrypted-media" style="border:none; border-radius:6px;"></iframe>
      `;

      // Simuler l'avancement de la barre de progression verte
      startProgressBar();
    }

    function startProgressBar() {
      clearInterval(progressInterval);
      let progress = 0;
      const progressBar = document.getElementById("progressBar");
      progressBar.style.width = "0%";

      progressInterval = setInterval(() => {
        if (progress < 100) {
          progress += 0.5;
          progressBar.style.width = progress + "%";
        } else {
          clearInterval(progressInterval);
        }
      }, 1000);
    }

    function openArtistModal(artist) {
      if(!recentHistory.includes(artist.id)) {
        recentHistory.unshift(artist.id);
        if(recentHistory.length > 8) recentHistory.pop();
        localStorage.setItem('recent_artists', JSON.stringify(recentHistory));
      }

      const modal = document.getElementById("artistModal");
      const modalBody = document.getElementById("modalBody");
      const avatarUrl = artist.avatar || 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400';

      let tracksHtml = "";
      if (artist.tracks.length > 0) {
        artist.tracks.forEach(track => {
          tracksHtml += `
            <li class="track-item">
              <span>${track.title}</span>
              <button class="play-btn" onclick="playTrack('${track.title.replace(/'/g, "\\'")}', '${track.youtube_id}')">▶ Écouter</button>
            </li>
          `;
        });
      } else {
        tracksHtml = `<li class="track-item"><span>Aucun titre disponible pour le moment.</span></li>`;
      }

      modalBody.innerHTML = `
        <div class="artist-header">
          <img src="${avatarUrl}" alt="${artist.name}" onerror="this.src='https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400'">
          <div>
            <h1>${artist.name}</h1>
            <p style="color: var(--text-dim);">${artist.handle}</p>
          </div>
        </div>
        <h3 style="margin-bottom: 0.5rem;">Musiques :</h3>
        <ul class="track-list">${tracksHtml}</ul>
      `;

      modal.style.display = "block";
    }

    function closeModal() {
      document.getElementById("artistModal").style.display = "none";
    }

    function handleSearch() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = rawData.filter(a => a.name.toLowerCase().includes(query));

      switchTab('artists');
      renderArtists(filtered, "artistGrid");
    }

    window.onclick = function(event) {
      const modal = document.getElementById("artistModal");
      if (event.target == modal) {
        closeModal();
      }
    }

    renderRecent();
    renderArtists(rawData, "artistGrid");
  </script>
</body>
</html>
