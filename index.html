<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>French Rap Vault - 50 Artistes & Musiques Réelles</title>
  <style>
    :root {
      --bg-color: #0d0f12;
      --card-bg: #161b22;
      --accent: #1db954;
      --accent-hover: #1ed760;
      --text: #f0f6fc;
      --text-dim: #8b949e;
      --border: #30363d;
      --player-bg: #181c24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    header {
      background-color: #06080a;
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    nav {
      display: flex;
      gap: 1.5rem;
    }

    nav button {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s;
    }

    nav button.active, nav button:hover {
      color: var(--text);
      border-bottom: 2px solid var(--accent);
    }

    .search-box input {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      width: 250px;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    main {
      flex: 1;
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .section-title {
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      font-weight: 700;
      border-left: 4px solid var(--accent);
      padding-left: 0.75rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--accent);
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .card-content {
      padding: 1rem;
    }

    .card-title {
      font-weight: 700;
      font-size: 1.1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-subtitle {
      color: var(--text-dim);
      font-size: 0.85rem;
      margin-top: 0.25rem;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.88);
      z-index: 200;
      overflow-y: auto;
      padding: 2rem;
    }

    .modal-content {
      background: var(--card-bg);
      max-width: 950px;
      margin: 2rem auto;
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 2rem;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      font-size: 2rem;
      color: var(--text-dim);
      cursor: pointer;
    }

    .artist-header {
      display: flex;
      gap: 2rem;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .artist-header img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent);
    }

    .album-title {
      font-size: 1.3rem;
      margin: 1.5rem 0 0.5rem 0;
      color: var(--accent);
    }

    .track-list {
      list-style: none;
      background: #0d0f12;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .track-item {
      padding: 0.8rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .track-item:last-child {
      border-bottom: none;
    }

    .track-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sources-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.4rem;
    }

    .source-btn {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid var(--border);
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      font-size: 0.75rem;
      text-decoration: none;
      transition: background 0.2s;
    }

    .source-btn:hover {
      background: var(--accent);
      color: #000;
    }

    .hidden { display: none; }
  </style>
</head>

    ];

    let recentHistory = JSON.parse(localStorage.getItem('recent_artists')) || [1, 2, 3];

    function renderArtists(artists, containerId) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";
      artists.forEach(artist => {
        const card = document.createElement("div");
        card.className = "card";
        card.onclick = () => openArtistModal(artist);
        card.innerHTML = `
          <img src="${artist.image}" alt="${artist.name}" onerror="this.src='https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400'">
          <div class="card-content">
            <div class="card-title">${artist.name}</div>
            <div class="card-subtitle">${artist.albums.length} Album(s)</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderRecent() {
      const recentArtists = artistsData.filter(a => recentHistory.includes(a.id));
      renderArtists(recentArtists, "recentGrid");
    }

    function switchTab(tab) {
      document.getElementById("sec-home").classList.add("hidden");
      document.getElementById("sec-artists").classList.add("hidden");
      document.getElementById("nav-home").classList.remove("active");
      document.getElementById("nav-artists").classList.remove("active");

      if(tab === 'home') {
        document.getElementById("sec-home").classList.remove("hidden");
        document.getElementById("nav-home").classList.add("active");
        renderRecent();
      } else {
        document.getElementById("sec-artists").classList.remove("hidden");
        document.getElementById("nav-artists").classList.add("active");
        renderArtists(artistsData, "artistGrid");
      }
    }

    function openArtistModal(artist) {
      if(!recentHistory.includes(artist.id)) {
        recentHistory.unshift(artist.id);
        if(recentHistory.length > 8) recentHistory.pop();
        localStorage.setItem('recent_artists', JSON.stringify(recentHistory));
      }

      const modal = document.getElementById("artistModal");
      const modalBody = document.getElementById("modalBody");

      let albumsHtml = "";
      artist.albums.forEach(album => {
        let tracksHtml = "";
        album.tracks.forEach(track => {
          let sourcesHtml = "";
          platformServices.forEach(platform => {
            sourcesHtml += `<a href="${platform.url(artist.name, track)}" target="_blank" class="source-btn">${platform.name}</a>`;
          });

          tracksHtml += `
            <li class="track-item">
              <div class="track-header">
                <strong>${track}</strong>
              </div>
              <div class="sources-grid">
                ${sourcesHtml}
              </div>
            </li>
          `;
        });

        albumsHtml += `
          <div class="album-section">
            <div class="album-title">Album: ${album.title}</div>
            <ul class="track-list">${tracksHtml}</ul>
          </div>
        `;
      });

      modalBody.innerHTML = `
        <div class="artist-header">
          <img src="${artist.image}" alt="${artist.name}" onerror="this.src='https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400'">
          <div>
            <h1>${artist.name}</h1>
            <p style="color: var(--text-dim); margin-top: 0.5rem;">Artiste Rap Français</p>
          </div>
        </div>
        ${albumsHtml}
      `;

      modal.style.display = "block";
    }

    function closeModal() {
      document.getElementById("artistModal").style.display = "none";
    }

    function handleSearch() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = artistsData.filter(a => a.name.toLowerCase().includes(query));

      switchTab('artists');
      renderArtists(filtered, "artistGrid");
    }

    window.onclick = function(event) {
      const modal = document.getElementById("artistModal");
      if (event.target == modal) {
        closeModal();
      }
    }

    renderRecent();
    renderArtists(artistsData, "artistGrid");
  </script>
</body>
</html>
