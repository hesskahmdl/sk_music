<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>French Rap Vault - TMDB style</title>
  <style>
    :root {
      --bg-color: #0d0f12;
      --card-bg: #161b22;
      --accent: #1db954;
      --accent-hover: #1ed760;
      --text: #f0f6fc;
      --text-dim: #8b949e;
      --border: #30363d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #06080a;
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    nav {
      display: flex;
      gap: 1.5rem;
    }

    nav button {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s;
    }

    nav button.active, nav button:hover {
      color: var(--text);
      border-bottom: 2px solid var(--accent);
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      width: 250px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    main {
      flex: 1;
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .section-title {
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      font-weight: 700;
      border-left: 4px solid var(--accent);
      padding-left: 0.75rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--accent);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card-content {
      padding: 1rem;
    }

    .card-title {
      font-weight: 700;
      font-size: 1.1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-subtitle {
      color: var(--text-dim);
      font-size: 0.85rem;
      margin-top: 0.25rem;
    }

    /* Modal / Artist Detail */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 200;
      overflow-y: auto;
      padding: 2rem;
    }

    .modal-content {
      background: var(--card-bg);
      max-width: 900px;
      margin: 2rem auto;
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 2rem;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      font-size: 2rem;
      color: var(--text-dim);
      cursor: pointer;
    }

    .artist-header {
      display: flex;
      gap: 2rem;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .artist-header img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent);
    }

    .album-section {
      margin-top: 2rem;
    }

    .album-title {
      font-size: 1.3rem;
      margin: 1rem 0 0.5rem 0;
      color: var(--accent);
    }

    .track-list {
      list-style: none;
      background: #0d0f12;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .track-item {
      padding: 0.75rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .track-item:last-child {
      border-bottom: none;
    }

    .links a {
      color: #fff;
      text-decoration: none;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      font-size: 0.8rem;
      margin-left: 0.5rem;
      font-weight: 600;
    }

    .link-spotify { background: #1db954; }
    .link-youtube { background: #ff0000; }

    .hidden { display: none; }
  </style>
</head>
<body>

  <header>
    <div class="logo">RapFR DB</div>
    <nav>
      <button id="nav-home" class="active" onclick="switchTab('home')">Accueil</button>
      <button id="nav-artists" onclick="switchTab('artists')">Artistes (50)</button>
    </nav>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Rechercher un artiste..." oninput="handleSearch()">
    </div>
  </header>

  <main>
    <!-- Section Home -->
    <section id="sec-home">
      <h2 class="section-title">Écoutés récemment</h2>
      <div class="grid" id="recentGrid"></div>
    </section>

    <!-- Section Artistes -->
    <section id="sec-artists" class="hidden">
      <h2 class="section-title">Catalogue des 50 Artistes Français</h2>
      <div class="grid" id="artistGrid"></div>
    </section>
  </main>

      { id: 49, name: "Favé", image: "https://images.unsplash.com/photo-1501386761578-eac5c94b800a?w=400", albums: [{ title: "ILLEGAL", tracks: ["Flashback", "Urus"] }] },
      { id: 50, name: "Kerchak", image: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=400", albums: [{ title: "Confiance", tracks: ["Sabor", "Calme-toi"] }] }
    ];

    // Enregistrement des écoutés récemment dans le localStorage
    let recentHistory = JSON.parse(localStorage.getItem('recent_artists')) || [1, 2, 3];

    function renderArtists(artists, containerId) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";
      artists.forEach(artist => {
        const card = document.createElement("div");
        card.className = "card";
        card.onclick = () => openArtistModal(artist);
        card.innerHTML = `
          <img src="${artist.image}" alt="${artist.name}">
          <div class="card-content">
            <div class="card-title">${artist.name}</div>
            <div class="card-subtitle">${artist.albums.length} Album(s)</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderRecent() {
      const recentArtists = artistsData.filter(a => recentHistory.includes(a.id));
      renderArtists(recentArtists, "recentGrid");
    }

    function switchTab(tab) {
      document.getElementById("sec-home").classList.add("hidden");
      document.getElementById("sec-artists").classList.add("hidden");
      document.getElementById("nav-home").classList.remove("active");
      document.getElementById("nav-artists").classList.remove("active");

      if(tab === 'home') {
        document.getElementById("sec-home").classList.remove("hidden");
        document.getElementById("nav-home").classList.add("active");
        renderRecent();
      } else {
        document.getElementById("sec-artists").classList.remove("hidden");
        document.getElementById("nav-artists").classList.add("active");
        renderArtists(artistsData, "artistGrid");
      }
    }

    function openArtistModal(artist) {
      // Ajouter aux écoutes récentes
      if(!recentHistory.includes(artist.id)) {
        recentHistory.unshift(artist.id);
        if(recentHistory.length > 8) recentHistory.pop();
        localStorage.setItem('recent_artists', JSON.stringify(recentHistory));
      }

      const modal = document.getElementById("artistModal");
      const modalBody = document.getElementById("modalBody");

      let albumsHtml = "";
      artist.albums.forEach(album => {
        let tracksHtml = "";
        album.tracks.forEach(track => {
          const spotifySearch = `https://open.spotify.com/search/${encodeURIComponent(artist.name + ' ' + track)}`;
          const youtubeSearch = `https://www.youtube.com/results?search_query=${encodeURIComponent(artist.name + ' ' + track)}`;

          tracksHtml += `
            <li class="track-item">
              <span>${track}</span>
              <div class="links">
                <a href="${spotifySearch}" target="_blank" class="link-spotify">Spotify</a>
                <a href="${youtubeSearch}" target="_blank" class="link-youtube">YouTube</a>
              </div>
            </li>
          `;
        });

        albumsHtml += `
          <div class="album-section">
            <div class="album-title">Album: ${album.title}</div>
            <ul class="track-list">${tracksHtml}</ul>
          </div>
        `;
      });

      modalBody.innerHTML = `
        <div class="artist-header">
          <img src="${artist.image}" alt="${artist.name}">
          <div>
            <h1>${artist.name}</h1>
            <p style="color: var(--text-dim); margin-top: 0.5rem;">Artiste Rap Français</p>
          </div>
        </div>
        ${albumsHtml}
      `;

      modal.style.display = "block";
    }

    function closeModal() {
      document.getElementById("artistModal").style.display = "none";
    }

    function handleSearch() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = artistsData.filter(a => a.name.toLowerCase().includes(query));

      // Basculer sur l'onglet artiste pour montrer les résultats
      switchTab('artists');
      renderArtists(filtered, "artistGrid");
    }

    // Initialisation
    window.onclick = function(event) {
      const modal = document.getElementById("artistModal");
      if (event.target == modal) {
        closeModal();
      }
    }

    renderRecent();
    renderArtists(artistsData, "artistGrid");
  </script>
</body>
</html>
