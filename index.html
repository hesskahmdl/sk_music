<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>French Rap Vault - Audio Player</title>
  <style>
    :root {
      --bg-color: #0d0f12;
      --card-bg: #161b22;
      --accent: #1db954;
      --accent-hover: #1ed760;
      --text: #f0f6fc;
      --text-dim: #8b949e;
      --border: #30363d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    header {
      background-color: #06080a;
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    nav {
      display: flex;
      gap: 1.5rem;
    }

    nav button {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s;
    }

    nav button.active, nav button:hover {
      color: var(--text);
      border-bottom: 2px solid var(--accent);
    }

    .search-box input {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      width: 250px;
      outline: none;
    }

    main {
      flex: 1;
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .section-title {
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      font-weight: 700;
      border-left: 4px solid var(--accent);
      padding-left: 0.75rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--accent);
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .card-content {
      padding: 1rem;
    }

    .card-title {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .card-subtitle {
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-top: 0.2rem;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.88);
      z-index: 200;
      overflow-y: auto;
      padding: 2rem;
    }

    .modal-content {
      background: var(--card-bg);
      max-width: 900px;
      margin: 2rem auto;
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 2rem;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      font-size: 2rem;
      color: var(--text-dim);
      cursor: pointer;
    }

    .artist-header {
      display: flex;
      gap: 2rem;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .artist-header img {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent);
    }

    .track-list {
      list-style: none;
      background: #0d0f12;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border);
      margin-top: 1rem;
      max-height: 400px;
      overflow-y: auto;
    }

    .track-item {
      padding: 0.8rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .track-item:hover {
      background: #161b22;
    }

    .play-btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-weight: 700;
      cursor: pointer;
    }

    .play-btn:hover {
      background: var(--accent-hover);
    }

    /* LECTEUR STYLE SPOTIFY SANS VIDÉO */
    .spotify-player {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 90px;
      background: #000000;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      align-items: center;
      padding: 0 1.5rem;
      z-index: 300;
    }

    .track-info {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .track-cover {
      width: 56px;
      height: 56px;
      border-radius: 4px;
      background: #282828;
      object-fit: cover;
    }

    .track-details {
      display: flex;
      flex-direction: column;
    }

    .track-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
    }

    .track-artist {
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .player-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .control-btn {
      background: none;
      border: none;
      color: #b3b3b3;
      cursor: pointer;
      font-size: 1rem;
      transition: color 0.2s, transform 0.1s;
    }

    .control-btn:hover {
      color: #fff;
    }

    .play-pause-btn {
      background: #fff;
      color: #000;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
    }

    .play-pause-btn:hover {
      transform: scale(1.05);
    }

    .playback-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
      max-width: 600px;
    }

    .time {
      font-size: 0.75rem;
      color: var(--text-dim);
      min-width: 35px;
    }

    .progress-bar-bg {
      flex: 1;
      height: 4px;
      background: #4d4d4d;
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #fff;
      border-radius: 2px;
    }

    .progress-bar-bg:hover .progress-bar-fill {
      background: var(--accent);
    }

    .hidden { display: none; }
  </style>
</head>
<body>

  <header>
    <div class="logo">RapFR DB</div>
    <nav>
      <button id="nav-home" class="active" onclick="switchTab('home')">Accueil</button>
      <button id="nav-artists" onclick="switchTab('artists')">Artistes</button>
    </nav>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Rechercher..." oninput="handleSearch()">
    </div>
  </header>

  <main>
    <section id="sec-home">
      <h2 class="section-title">Récemment consultés</h2>
      <div class="grid" id="recentGrid"></div>
    </section>

    <section id="sec-artists" class="hidden">
      <h2 class="section-title">Artistes Français</h2>
      <div class="grid" id="artistGrid"></div>
    </section>
  </main>

  <div id="artistModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Barre de lecture audio complète sans vidéo -->
  <div class="spotify-player">
    <div class="track-info">
      <img id="playerCover" class="track-cover" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=100" alt="Cover">
      <div class="track-details">
        <span id="playerTrackTitle" class="track-name">Aucun titre sélectionné</span>
        <span id="playerArtistName" class="track-artist">-</span>
      </div>
    </div>

    <div class="player-center">
      <div class="controls">
        <button class="control-btn" onclick="prevTrack()">⏮</button>
        <button id="mainPlayBtn" class="play-pause-btn" onclick="togglePlay()">▶</button>
        <button class="control-btn" onclick="nextTrack()">⏭</button>
      </div>
      <div class="playback-bar">
        <span id="currentTime" class="time">0:00</span>
        <div class="progress-bar-bg" onclick="seekTrack(event)">
          <div id="playerProgress" class="progress-bar-fill"></div>
        </div>
        <span id="totalTime" class="time">0:00</span>
      </div>
    </div>
    <div></div>
  </div>

  <audio id="audioElement"></audio>

  <script>
    const rawData = [
      {
        "id": 1,
        "name": "Lagui",
        "handle": "@Laguitreize",
        "avatar": "https://yt3.googleusercontent.com/n4_J9HkwLGdi1-wi5KcX6veaaQf5ZRzDLNP0CiGatLM8eXzHueN41a0nsS5mYi6FtKK9PqBRIw=s0",
        "tracks": [
          {"title": "OLIVIA VALERE", "url": ""},
          {"title": "Capo", "url": ""},
          {"title": "Mandat de dépôt (Feat. Jul)", "url": ""},
          {"title": "Grosse salope", "url": ""},
          {"title": "La Donneuse (Feat. Gazo)", "url": ""},
          {"title": "Bob Marley (Feat. Kaaris)", "url": ""}
        ]
      },
      {
        "id": 2,
        "name": "JUL",
        "handle": "@DORETDEPLATINE",
        "avatar": "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400",
        "tracks": []
      },
      {
        "id": 3,
        "name": "Werenoi",
        "handle": "@werenoi93",
        "avatar": "https://yt3.googleusercontent.com/s_5PfxJQU8Xvzedu_NlV-lBnpasJ0vl9BOXKH9G3EtMspPRQg5YMWz_rJIW5d9aVPBYQk3OTKQ=s0",
        "tracks": [
          {"title": "Piano (ft. GIMS)", "url": ""},
          {"title": "Triple V (ft. Damso, Ninho)", "url": ""},
          {"title": "En pétard (ft. PLK)", "url": ""},
          {"title": "La famine (ft. Gazo)", "url": ""},
          {"title": "Dans un verre (ft. SDM)", "url": ""}
        ]
      },
      {
        "id": 4,
        "name": "Maes",
        "handle": "@Maesofficiel",
        "avatar": "https://yt3.googleusercontent.com/3kGYRhyoa_2Glq46ztlqROi2G9fIBqQkMWo89PEWZj469Eqfz8CVVcCb-kyxIIfLWEV_GYE-8h0=s0",
        "tracks": [
          {"title": "RIVOLI", "url": ""},
          {"title": "SANS BOUSSOLE", "url": ""},
          {"title": "SURVIE (ft. Ninho)", "url": ""},
          {"title": "4MOTION (ft. PLK)", "url": ""},
          {"title": "Dybala (ft. Jul)", "url": ""}
        ]
      },
      {
        "id": 5,
        "name": "Ninho",
        "handle": "@NinhoOfficiel",
        "avatar": "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400",
        "tracks": []
      },
      {
        "id": 6,
        "name": "SDM",
        "handle": "@SDMofficiel",
        "avatar": "https://yt3.googleusercontent.com/HPXJxcfCQfui4DCxZrBi64AnDPL5ryZQbbXCyjrCRyp1h9RfV7qrSAsk3tzDI6juOunAq2Lw=s0",
        "tracks": [
          {"title": "Karma (ft. Kizz Bouba)", "url": ""},
          {"title": "Papa laisse moi", "url": ""}
        ]
      },
      {
        "id": 7,
        "name": "Gazo",
        "handle": "@GazoOfficiel",
        "avatar": "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400",
        "tracks": []
      },
      {
        "id": 8,
        "name": "Tiakola",
        "handle": "@TiakolaOfficiel",
        "avatar": "https://yt3.googleusercontent.com/jAW34xcjZoWo2bnEJoz3QZLEJob_Ee15VqJ_VKYG6EOybfmq3qhKBbELbDnl2nRsFIDM15oaWAc=s0",
        "tracks": [
          {"title": "Offbeat Melo", "url": ""},
          {"title": "MBIFE (ft. Genezio)", "url": ""},
          {"title": "NOTRE DAME (ft. Gazo)", "url": ""}
        ]
      }
    ];

    let currentArtist = null;
    let currentTrackIndex = 0;
    const audio = document.getElementById("audioElement");
    let recentHistory = JSON.parse(localStorage.getItem('recent_artists')) || [1, 3, 4, 8];

    function renderArtists(artists, containerId) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";
      artists.forEach(artist => {
        const avatarUrl = artist.avatar || 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400';
        const card = document.createElement("div");
        card.className = "card";
        card.onclick = () => openArtistModal(artist);
        card.innerHTML = `
          <img src="${avatarUrl}" alt="${artist.name}" onerror="this.src='https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400'">
          <div class="card-content">
            <div class="card-title">${artist.name}</div>
            <div class="card-subtitle">${artist.tracks.length} morceau(x)</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderRecent() {
      const recentArtists = rawData.filter(a => recentHistory.includes(a.id));
      renderArtists(recentArtists, "recentGrid");
    }

    function switchTab(tab) {
      document.getElementById("sec-home").classList.add("hidden");
      document.getElementById("sec-artists").classList.add("hidden");
      document.getElementById("nav-home").classList.remove("active");
      document.getElementById("nav-artists").classList.remove("active");

      if(tab === 'home') {
        document.getElementById("sec-home").classList.remove("hidden");
        document.getElementById("nav-home").classList.add("active");
        renderRecent();
      } else {
        document.getElementById("sec-artists").classList.remove("hidden");
        document.getElementById("nav-artists").classList.add("active");
        renderArtists(rawData, "artistGrid");
      }
    }

    function playAudio(artist, index) {
      currentArtist = artist;
      currentTrackIndex = index;
      const track = artist.tracks[index];

      document.getElementById("playerTrackTitle").innerText = track.title;
      document.getElementById("playerArtistName").innerText = artist.name;
      document.getElementById("playerCover").src = artist.avatar;

      if (track.url) {
        audio.src = track.url;
        audio.play();
        document.getElementById("mainPlayBtn").innerText = "❚❚";
      } else {
        document.getElementById("mainPlayBtn").innerText = "▶";
      }
    }

    function togglePlay() {
      if (!audio.src) return;
      if (audio.paused) {
        audio.play();
        document.getElementById("mainPlayBtn").innerText = "❚❚";
      } else {
        audio.pause();
        document.getElementById("mainPlayBtn").innerText = "▶";
      }
    }

    function prevTrack() {
      if (currentArtist && currentTrackIndex > 0) {
        playAudio(currentArtist, currentTrackIndex - 1);
      }
    }

    function nextTrack() {
      if (currentArtist && currentTrackIndex < currentArtist.tracks.length - 1) {
        playAudio(currentArtist, currentTrackIndex + 1);
      }
    }

    audio.addEventListener("timeupdate", () => {
      if (!audio.duration) return;
      const progress = (audio.currentTime / audio.duration) * 100;
      document.getElementById("playerProgress").style.width = `${progress}%`;
      document.getElementById("currentTime").innerText = formatTime(audio.currentTime);
      document.getElementById("totalTime").innerText = formatTime(audio.duration);
    });

    function seekTrack(e) {
      if (!audio.duration) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      audio.currentTime = (clickX / rect.width) * audio.duration;
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function openArtistModal(artist) {
      if(!recentHistory.includes(artist.id)) {
        recentHistory.unshift(artist.id);
        if(recentHistory.length > 8) recentHistory.pop();
        localStorage.setItem('recent_artists', JSON.stringify(recentHistory));
      }

      const modal = document.getElementById("artistModal");
      const modalBody = document.getElementById("modalBody");
      const avatarUrl = artist.avatar || 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400';

      let tracksHtml = "";
      if (artist.tracks.length > 0) {
        artist.tracks.forEach((track, idx) => {
          tracksHtml += `
            <li class="track-item">
              <span>${track.title}</span>
              <button class="play-btn" onclick="playAudio(rawData[${artist.id - 1}], ${idx})">▶ Écouter</button>
            </li>
          `;
        });
      } else {
        tracksHtml = `<li class="track-item"><span>Aucun titre disponible pour le moment.</span></li>`;
      }

      modalBody.innerHTML = `
        <div class="artist-header">
          <img src="${avatarUrl}" alt="${artist.name}" onerror="this.src='https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400'">
          <div>
            <h1>${artist.name}</h1>
            <p style="color: var(--text-dim);">${artist.handle}</p>
          </div>
        </div>
        <h3 style="margin-bottom: 0.5rem;">Toutes les musiques :</h3>
        <ul class="track-list">${tracksHtml}</ul>
      `;

      modal.style.display = "block";
    }

    function closeModal() {
      document.getElementById("artistModal").style.display = "none";
    }

    function handleSearch() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = rawData.filter(a => a.name.toLowerCase().includes(query));

      switchTab('artists');
      renderArtists(filtered, "artistGrid");
    }

    window.onclick = function(event) {
      const modal = document.getElementById("artistModal");
      if (event.target == modal) {
        closeModal();
      }
    }

    renderRecent();
    renderArtists(rawData, "artistGrid");
  </script>
</body>
</html>
