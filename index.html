<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>French Rap Vault - Lecteur Intégré</title>
  <style>
    :root {
      --bg-color: #0d0f12;
      --card-bg: #161b22;
      --accent: #1db954;
      --accent-hover: #1ed760;
      --text: #f0f6fc;
      --text-dim: #8b949e;
      --border: #30363d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #06080a;
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    nav {
      display: flex;
      gap: 1.5rem;
    }

    nav button {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s;
    }

    nav button.active, nav button:hover {
      color: var(--text);
      border-bottom: 2px solid var(--accent);
    }

    .search-box input {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      width: 250px;
      outline: none;
    }

    main {
      flex: 1;
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .section-title {
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      font-weight: 700;
      border-left: 4px solid var(--accent);
      padding-left: 0.75rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--accent);
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .card-content {
      padding: 1rem;
    }

    .card-title {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.88);
      z-index: 200;
      overflow-y: auto;
      padding: 2rem;
    }

    .modal-content {
      background: var(--card-bg);
      max-width: 900px;
      margin: 2rem auto;
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 2rem;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      font-size: 2rem;
      color: var(--text-dim);
      cursor: pointer;
    }

    .artist-header {
      display: flex;
      gap: 2rem;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .artist-header img {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent);
    }

    .track-list {
      list-style: none;
      background: #0d0f12;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border);
      margin-top: 1rem;
    }

    .track-item {
      padding: 0.8rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .play-btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-weight: 700;
      cursor: pointer;
    }

    .player-container {
      margin-top: 1.5rem;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      min-height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    iframe {
      width: 100%;
      height: 200px;
      border: none;
    }

    .hidden { display: none; }
  </style>
</head>
<body>

  <header>
    <div class="logo">RapFR DB</div>
    <nav>
      <button id="nav-home" class="active" onclick="switchTab('home')">Accueil</button>
      <button id="nav-artists" onclick="switchTab('artists')">Artistes (50)</button>
    </nav>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Rechercher..." oninput="handleSearch()">
    </div>
  </header>

  <main>
    <section id="sec-home">
      <h2 class="section-title">Récemment consultés</h2>
      <div class="grid" id="recentGrid"></div>
    </section>

    <section id="sec-artists" class="hidden">
      <h2 class="section-title">50 Artistes Français</h2>
      <div class="grid" id="artistGrid"></div>
    </section>
  </main>

  <div id="artistModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    const artistsData = [
      { id: 1, name: "Werenoi", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d1/Werenoi_2023.jpg/400px-Werenoi_2023.jpg", tracks: ["Laboratoire", "Chocolat", "10.03.2023"] },
      { id: 2, name: "Maes", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/68/Maes_2020.jpg/400px-Maes_2020.jpg", tracks: ["Blanche", "Distant", "Dybala"] },
      { id: 3, name: "La Fève", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/La_F%C3%A8ve_rapper.jpg/400px-La_F%C3%A8ve_rapper.jpg", tracks: ["MAUVAIS PAYEUR", "ZAZA", "LOYAL"] },
      { id: 4, name: "Ninho", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/Ninho_2019.jpg/400px-Ninho_2019.jpg", tracks: ["Goutte d'eau", "Putana", "Jefe"] },
      { id: 5, name: "JUL", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/07/Jul_2016.jpg/400px-Jul_2016.jpg", tracks: ["En Y", "J'oublie tout", "Tchikita"] }
    ];

    let recentHistory = JSON.parse(localStorage.getItem('recent_artists')) || [1, 2, 3];

    function renderArtists(artists, containerId) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";
      artists.forEach(artist => {
        const card = document.createElement("div");
        card.className = "card";
        card.onclick = () => openArtistModal(artist);
        card.innerHTML = `
          <img src="${artist.image}" alt="${artist.name}" onerror="this.src='https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400'">
          <div class="card-content">
            <div class="card-title">${artist.name}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderRecent() {
      const recentArtists = artistsData.filter(a => recentHistory.includes(a.id));
      renderArtists(recentArtists, "recentGrid");
    }

    function switchTab(tab) {
      document.getElementById("sec-home").classList.add("hidden");
      document.getElementById("sec-artists").classList.add("hidden");
      document.getElementById("nav-home").classList.remove("active");
      document.getElementById("nav-artists").classList.remove("active");

      if(tab === 'home') {
        document.getElementById("sec-home").classList.remove("hidden");
        document.getElementById("nav-home").classList.add("active");
        renderRecent();
      } else {
        document.getElementById("sec-artists").classList.remove("hidden");
        document.getElementById("nav-artists").classList.add("active");
        renderArtists(artistsData, "artistGrid");
      }
    }

    function playEmbed(artistName, trackName) {
      const query = encodeURIComponent(`${artistName} ${trackName}`);
      const embedArea = document.getElementById("embedPlayer");
      // Intégration du lecteur YouTube direct
      embedArea.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed?listType=search&list=${query}&autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
    }

    function openArtistModal(artist) {
      if(!recentHistory.includes(artist.id)) {
        recentHistory.unshift(artist.id);
        if(recentHistory.length > 8) recentHistory.pop();
        localStorage.setItem('recent_artists', JSON.stringify(recentHistory));
      }

      const modal = document.getElementById("artistModal");
      const modalBody = document.getElementById("modalBody");

      let tracksHtml = "";
      artist.tracks.forEach(track => {
        tracksHtml += `
          <li class="track-item">
            <span>${track}</span>
            <button class="play-btn" onclick="playEmbed('${artist.name.replace(/'/g, "\\'")}', '${track.replace(/'/g, "\\'")}')">▶ Jouer sur le site</button>
          </li>
        `;
      });

      modalBody.innerHTML = `
        <div class="artist-header">
          <img src="${artist.image}" alt="${artist.name}" onerror="this.src='https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400'">
          <div>
            <h1>${artist.name}</h1>
            <p style="color: var(--text-dim);">Sélectionnez un titre pour lancer le lecteur</p>
          </div>
        </div>
        <div class="player-container" id="embedPlayer">
          <p style="color: var(--text-dim);">Cliquez sur "Jouer sur le site" pour charger la musique.</p>
        </div>
        <ul class="track-list">${tracksHtml}</ul>
      `;

      modal.style.display = "block";
    }

    function closeModal() {
      document.getElementById("artistModal").style.display = "none";
    }

    function handleSearch() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = artistsData.filter(a => a.name.toLowerCase().includes(query));

      switchTab('artists');
      renderArtists(filtered, "artistGrid");
    }

    window.onclick = function(event) {
      const modal = document.getElementById("artistModal");
      if (event.target == modal) {
        closeModal();
      }
    }

    renderRecent();
    renderArtists(artistsData, "artistGrid");
  </script>
</body>
</html>
